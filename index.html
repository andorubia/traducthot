<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TraducThot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="contenedor">
    <h1>Thot: El traductor de los escribas</h1>
    
    <p>Entrega tu mensaje:</p>

    <div id="pantalla-jeroglifica" class="pantalla">...</div>

    <div class="acciones">
      <button onclick="borrarUltimo()" class="btn-borrar">⌫ Borrar papiro</button>
      <button onclick="limpiarTodo()" class="btn-limpiar">📜 Nuevo papiro</button>
      <button onclick="traducirAEmojis()" class="btn-traducir" style="color: white;">✨ Consultar a Thot</button>
    </div>

    <div class="teclado-grid" id="teclado"></div>

    <div class="resultado-box">
      <h3>Tu mensaje traducido:</h3>
      <div id="resultado-emojis">...</div>
      <p id="explicacion-traduccion" class="explicacion"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
